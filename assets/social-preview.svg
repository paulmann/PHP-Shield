<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="PHP Shield — Local threat detection, AbuseIPDB reputation, rate limiting and severity-based IP blocking: one entry point, one verdict.">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b3354"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="0" y="0" width="1280" height="5" rx="0" fill="#4f9cf9" stroke="#4f9cf9" stroke-width="1"/>
  <text x="48" y="84" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#4f9cf9" text-anchor="start">PHP REQUEST FIREWALL</text>
  <text x="48" y="172" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="76" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="48"><tspan fill="#4f9cf9">P</tspan>HP</tspan><tspan x="201">Shield</tspan></text>
  <text x="48" y="242" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#e6edf3" text-anchor="start">Local threat detection, AbuseIPDB reputation, rate limiting and severity-based IP</text>
  <text x="48" y="280" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#e6edf3" text-anchor="start">blocking: one entry point, one verdict.</text>
  <text x="48" y="342" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="20" fill="#96a4b2" text-anchor="start">AbuseIPDB.com and AbuseIPDB.ru behind one client, a cache, a quota window and a circuit breaker</text>
  <rect x="48" y="368" width="129" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="66" y="392" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">8.1-8.5 PHP</text>
  <rect x="189" y="368" width="167" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="207" y="392" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">6 detection rules</text>
  <rect x="368" y="368" width="108" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="386" y="392" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">120 tests</text>
  <rect x="488" y="368" width="182" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="506" y="392" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">level max PHPStan</text>
  <rect x="682" y="368" width="123" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="700" y="392" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">MIT license</text>
  <rect x="48" y="416" width="1184" height="154" rx="16" fill="#0a1018" stroke="#22303f" stroke-width="1"/>
  <circle cx="68" cy="438" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="438" r="6" fill="#ffbd2e"/>
  <circle cx="112" cy="438" r="6" fill="#27c93f"/>
  <line x1="48" y1="460" x2="1232" y2="460" stroke="#22303f" stroke-width="1"/>
  <text x="144" y="443" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#96a4b2" text-anchor="start">PHP Shield · github.com/paulmann/PHP-Shield</text>
  <text x="76" y="486" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#e6edf3" text-anchor="start"><tspan fill="#4f9cf9">$ </tspan>composer require paulmann/php-shield</text>
  <text x="76" y="513" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#96a4b2" text-anchor="start">$d = $shield-&gt;inspect($_GET + $_POST, $_SERVER);</text>
  <text x="76" y="540" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#96a4b2" text-anchor="start">blocked=true reason=threat_detected score=90</text>
  <text x="48" y="606" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">github.com/paulmann/PHP-Shield</text>
</svg>
